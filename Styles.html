<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg-base: #0b0f19;
    --bg-surface: #111827;
    --bg-card: rgba(17, 24, 39, 0.85);
    --bg-card-hover: rgba(31, 41, 55, 0.9);
    --bg-glass: rgba(255, 255, 255, 0.04);
    
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-highlight: rgba(239, 68, 68, 0.35);

    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;

    --brand-red: #ef4444;
    --brand-red-dark: #b91c1c;
    --brand-red-glow: rgba(239, 68, 68, 0.25);
    --brand-amber: #f59e0b;
    --brand-gold: #fbbf24;

    --status-success: #10b981;
    --status-success-bg: rgba(16, 185, 129, 0.12);
    --status-warning: #f59e0b;
    --status-warning-bg: rgba(245, 158, 11, 0.12);
    --status-danger: #ef4444;
    --status-danger-bg: rgba(239, 68, 68, 0.12);
    --status-info: #3b82f6;
    --status-info-bg: rgba(59, 130, 246, 0.12);

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-full: 9999px;

    --shadow-soft: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    --shadow-glow: 0 0 25px rgba(239, 68, 68, 0.2);

    --font-heading: 'Outfit', sans-serif;
    --font-body: 'Inter', sans-serif;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-color: var(--bg-base);
    background-image: 
      radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.08) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.1) 0px, transparent 50%);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header & Navigation Bar */
  .app-header {
    background: rgba(11, 15, 25, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-subtle);
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 0.85rem 1.5rem;
  }

  .header-container {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .brand-badge {
    width: 42px;
    height: 42px;
    background: linear-gradient(135deg, var(--brand-red), var(--brand-amber));
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-glow);
    color: #fff;
    font-weight: 800;
    font-size: 1.3rem;
  }

  .brand-title h1 {
    font-family: var(--font-heading);
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  .brand-title p {
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .user-badge-group {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .user-pill {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    padding: 0.4rem 0.85rem;
    border-radius: var(--radius-full);
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.85rem;
  }

  .user-role-tag {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0.15rem 0.5rem;
    border-radius: var(--radius-full);
    text-transform: uppercase;
  }

  .role-admin { background: var(--status-danger-bg); color: var(--status-danger); border: 1px solid rgba(239, 68, 68, 0.3); }
  .role-gestor { background: var(--status-warning-bg); color: var(--status-warning); border: 1px solid rgba(245, 158, 11, 0.3); }
  .role-militar { background: var(--status-info-bg); color: var(--status-info); border: 1px solid rgba(59, 130, 246, 0.3); }

  /* Main Container */
  .main-wrapper {
    max-width: 1280px;
    margin: 0 auto;
    padding: 1.75rem 1.5rem;
    width: 100%;
    flex: 1;
  }

  /* Metric KPI Cards */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.25rem;
    margin-bottom: 2rem;
  }

  .kpi-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: var(--transition);
  }

  .kpi-card:hover {
    border-color: var(--border-highlight);
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
  }

  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--brand-red);
  }

  .kpi-label {
    font-size: 0.8rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .kpi-value {
    font-family: var(--font-heading);
    font-size: 1.6rem;
    font-weight: 700;
    margin-top: 0.35rem;
    color: var(--text-primary);
  }

  .kpi-subtext {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }

  /* Tabs Navigation */
  .nav-tabs {
    display: flex;
    gap: 0.5rem;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 1.75rem;
    overflow-x: auto;
  }

  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font-heading);
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.75rem 1.25rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: var(--transition);
    white-space: nowrap;
  }

  .tab-btn:hover {
    color: var(--text-primary);
  }

  .tab-btn.active {
    color: var(--brand-red);
    border-bottom-color: var(--brand-red);
  }

  /* Tab Panes */
  .tab-pane {
    display: none;
  }

  .tab-pane.active {
    display: block;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Banner de Chamada / Turn Alert */
  .turn-banner {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(245, 158, 11, 0.1));
    border: 1px solid rgba(239, 68, 68, 0.4);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    margin-bottom: 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    box-shadow: var(--shadow-glow);
  }

  .turn-banner.waiting {
    background: var(--bg-card);
    border-color: var(--border-subtle);
    box-shadow: none;
  }

  .pulse-indicator {
    width: 10px;
    height: 10px;
    background-color: var(--brand-red);
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
    animation: pulse 1.8s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  /* Grid de Datas Elegíveis */
  .dates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 1rem;
    margin-top: 1.25rem;
  }

  .date-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 1rem 0.75rem;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
  }

  .date-card:hover:not(.disabled) {
    border-color: var(--brand-red);
    transform: scale(1.03);
    box-shadow: var(--shadow-soft);
  }

  .date-card.selected {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(185, 28, 28, 0.3));
    border-color: var(--brand-red);
    box-shadow: var(--shadow-glow);
  }

  .date-card.disabled {
    opacity: 0.45;
    cursor: not-allowed;
    background: rgba(17, 24, 39, 0.4);
    border-style: dashed;
  }

  .date-day-name {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-secondary);
    font-weight: 600;
  }

  .date-number {
    font-family: var(--font-heading);
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0.25rem 0;
  }

  .date-status-tag {
    font-size: 0.65rem;
    font-weight: 600;
    padding: 0.15rem 0.45rem;
    border-radius: var(--radius-full);
    display: inline-block;
  }

  .date-available { background: var(--status-success-bg); color: var(--status-success); }
  .date-taken { background: var(--status-danger-bg); color: var(--status-danger); }

  /* Fila de Antiguidade - Tabela Moderna */
  .table-container {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    overflow: hidden;
    backdrop-filter: blur(10px);
    box-shadow: var(--shadow-soft);
  }

  .queue-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  .queue-table th {
    background: rgba(17, 24, 39, 0.95);
    padding: 0.9rem 1.25rem;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border-subtle);
  }

  .queue-table td {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 0.9rem;
    color: var(--text-primary);
  }

  .queue-table tr:last-child td {
    border-bottom: none;
  }

  .queue-table tr.highlight-my-row {
    background: rgba(239, 68, 68, 0.08);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.65rem;
    border-radius: var(--radius-full);
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge-sua-vez { background: var(--status-danger-bg); color: var(--status-danger); border: 1px solid rgba(239, 68, 68, 0.3); font-weight: 700; }
  .badge-escolhido { background: var(--status-success-bg); color: var(--status-success); border: 1px solid rgba(16, 185, 129, 0.3); }
  .badge-aguardando { background: rgba(148, 163, 184, 0.1); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
  .badge-passou { background: var(--status-warning-bg); color: var(--status-warning); border: 1px solid rgba(245, 158, 11, 0.3); }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-family: var(--font-heading);
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.65rem 1.35rem;
    border-radius: var(--radius-md);
    border: none;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--brand-red), var(--brand-red-dark));
    color: #fff;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    background: var(--bg-surface);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
  }

  .btn-secondary:hover:not(:disabled) {
    background: var(--bg-card-hover);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .btn-danger {
    background: rgba(239, 68, 68, 0.15);
    color: var(--brand-red);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .btn-danger:hover {
    background: var(--brand-red);
    color: #fff;
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1.5rem;
  }

  .modal-overlay.active {
    display: flex;
    animation: fadeIn 0.2s ease;
  }

  .modal-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 520px;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }

  .modal-header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-header h3 {
    font-family: var(--font-heading);
    font-size: 1.15rem;
    font-weight: 700;
  }

  .modal-body {
    padding: 1.5rem;
  }

  .modal-footer {
    padding: 1rem 1.5rem;
    background: rgba(0, 0, 0, 0.25);
    border-top: 1px solid var(--border-subtle);
    display: flex;
    justify-content: flex-end;
    gap: 0.75rem;
  }

  /* Form Elements */
  .form-group {
    margin-bottom: 1.25rem;
  }

  .form-label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.4rem;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: rgba(17, 24, 39, 0.8);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    padding: 0.65rem 0.85rem;
    font-family: var(--font-body);
    font-size: 0.9rem;
    transition: var(--transition);
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--brand-red);
    box-shadow: 0 0 0 2px var(--brand-red-glow);
  }

  /* Toast Notifications */
  .toast-container {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    max-width: 380px;
    width: 100%;
  }

  .toast {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 1rem;
    box-shadow: var(--shadow-soft);
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .toast-success { border-left: 4px solid var(--status-success); }
  .toast-error { border-left: 4px solid var(--status-danger); }
  .toast-info { border-left: 4px solid var(--status-info); }

  /* Loading Overlay */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(11, 15, 25, 0.8);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    z-index: 300;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--brand-red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Banner da Janela Oficial de Escolha e Bloqueio */
  .window-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.5rem;
    border-radius: var(--radius-lg);
    margin-bottom: 1.75rem;
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.85));
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: all 0.3s ease;
  }

  .window-banner.window-open {
    border-color: rgba(16, 185, 129, 0.4);
    background: linear-gradient(135deg, rgba(6, 78, 59, 0.3), rgba(15, 23, 42, 0.85));
  }

  .window-banner.window-blocked {
    border-color: rgba(239, 68, 68, 0.4);
    background: linear-gradient(135deg, rgba(127, 29, 29, 0.35), rgba(15, 23, 42, 0.9));
  }

  .window-banner-icon {
    font-size: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .window-banner-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .window-banner-content strong {
    font-family: var(--font-heading);
    font-size: 1rem;
    color: #fff;
  }

  .window-banner-content span {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .window-banner-tag {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 0.35rem 0.85rem;
    border-radius: 9999px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .tag-open {
    background: rgba(16, 185, 129, 0.2);
    color: var(--status-success);
    border: 1px solid rgba(16, 185, 129, 0.4);
  }

  .tag-blocked {
    background: rgba(239, 68, 68, 0.2);
    color: var(--status-danger);
    border: 1px solid rgba(239, 68, 68, 0.4);
  }

  /* Status Badges para Regras Especiais */
  .badge-nao-faz-jus {
    background: rgba(245, 158, 11, 0.15);
    color: var(--brand-amber);
    border: 1px solid rgba(245, 158, 11, 0.35);
  }

  .badge-acumulo {
    background: rgba(147, 51, 234, 0.15);
    color: #c084fc;
    border: 1px solid rgba(147, 51, 234, 0.35);
  }

  /* Responsive Adjustments */
  @media (max-width: 768px) {
    .header-container { flex-direction: column; gap: 0.75rem; align-items: flex-start; }
    .kpi-grid { grid-template-columns: 1fr; }
    .nav-tabs { padding-bottom: 0.25rem; }
    .window-banner { flex-direction: column; align-items: flex-start; }
  }
</style>
