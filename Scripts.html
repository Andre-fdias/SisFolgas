<script>
  /**
   * SISTEMA SEGURO DE GERENCIAMENTO E ESCOLHA DE FOLGAS (CBM)
   * Scripts.html - Controlador reativo do frontend, comunicação assíncrona segura e regras de negócio
   */

  const App = (function() {
    // Estado Reativo da Aplicação
    const state = {
      authenticated: false,
      user: null,
      activePeriod: null,
      choiceWindow: null,
      queues: {},
      militares: [],
      militarFilter: 'TODAS',
      militarSearch: '',
      selectedTeam: 'Verde',
      selectedUnidade: 'TODAS',
      selectedDate: null,
      isSubmitting: false,
      myChoice: null
    };

    /* ==========================================================================
       CONTROLE DE SESSÃO VOLÁTIL (sessionStorage) E INATIVIDADE (10 MINUTOS)
       ========================================================================== */
    const SESSION_TIMEOUT_MS = 10 * 60 * 1000; // 10 minutos (600.000 ms)
    const WARNING_BEFORE_TIMEOUT_MS = 60 * 1000; // Aviso prévio nos últimos 60 segundos (ao 9º minuto)
    let idleTimer = null;
    let warningTimer = null;
    let warningToastShown = false;

    function resetIdleTimer() {
      if (!state.authenticated) return;

      if (idleTimer) clearTimeout(idleTimer);
      if (warningTimer) clearTimeout(warningTimer);

      sessionStorage.setItem('sisfolgas_last_activity', String(Date.now()));

      // Aviso sutil aos 9 minutos de inatividade
      warningTimer = setTimeout(() => {
        if (state.authenticated && !warningToastShown) {
          warningToastShown = true;
          showToast('⚠️ Sua sessão irá expirar em 60 segundos por inatividade!', 'error');
        }
      }, SESSION_TIMEOUT_MS - WARNING_BEFORE_TIMEOUT_MS);

      // Logout forçado ao atingir 10 minutos sem atividade
      idleTimer = setTimeout(() => {
        encerrarSessaoPorInatividade();
      }, SESSION_TIMEOUT_MS);
    }

    function encerrarSessaoPorInatividade() {
      fazerLogout('Sessão encerrada automaticamente após 10 minutos de inatividade para a segurança dos seus dados.');
    }

    function setupActivityListeners() {
      const activityEvents = ['mousemove', 'keydown', 'mousedown', 'touchstart', 'scroll', 'click'];
      let throttleTimeout = null;

      activityEvents.forEach(evt => {
        window.addEventListener(evt, () => {
          if (!throttleTimeout) {
            throttleTimeout = setTimeout(() => {
              throttleTimeout = null;
              warningToastShown = false;
              resetIdleTimer();
            }, 1000); // Throttle de 1 segundo para eficiência
          }
        }, { passive: true });
      });
    }

    /* ==========================================================================
       INICIALIZAÇÃO E UTILITÁRIOS
       ========================================================================== */

    function init() {
      setupTabNavigation();
      setupEventListeners();
      setupAdminForms();
      setupActivityListeners();

      // Limpeza de segurança: remove do localStorage qualquer resíduo legado em disco
      try {
        localStorage.removeItem('sisfolgas_session_re');
      } catch (e) {}

      const savedRe = sessionStorage.getItem('sisfolgas_session_re');
      const lastActivity = Number(sessionStorage.getItem('sisfolgas_last_activity') || '0');
      const now = Date.now();
      const isExpired = lastActivity && (now - lastActivity > SESSION_TIMEOUT_MS);

      const loginScreen = document.getElementById('login-screen');
      const appContainer = document.getElementById('app-container');

      if (!savedRe || isExpired) {
        sessionStorage.removeItem('sisfolgas_session_re');
        sessionStorage.removeItem('sisfolgas_last_activity');
        sessionStorage.removeItem('sisfolgas_session_token');

        // Sem sessão: exibe Tela de Login dedicada e oculta o app
        if (loginScreen) loginScreen.style.display = 'flex';
        if (appContainer) appContainer.style.display = 'none';

        if (isExpired) {
          const errElem = document.getElementById('login-screen-error');
          if (errElem) {
            errElem.textContent = 'Sessão anterior expirada por inatividade (10 minutos). Identifique-se com seu RE.';
            errElem.style.display = 'flex';
          }
        }

        const reInput = document.getElementById('login-screen-re');
        if (reInput) setTimeout(() => reInput.focus(), 150);
      } else {
        // Sessão existente no sessionStorage: oculta a tela de login, exibe o app e carrega dados
        if (loginScreen) loginScreen.style.display = 'none';
        if (appContainer) appContainer.style.display = 'block';
        resetIdleTimer();
        loadInitialState();
      }
    }

    function showLoading(text) {
      const overlay = document.getElementById('loading-overlay');
      const textElem = document.getElementById('loading-text');
      if (textElem && text) textElem.textContent = text;
      if (overlay) overlay.style.display = 'flex';
    }

    function hideLoading() {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.style.display = 'none';
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <div style="font-size: 1.1rem;">${type === 'success' ? '✅' : (type === 'error' ? '⚠️' : 'ℹ️')}</div>
        <div style="flex: 1; font-size: 0.88rem; color: var(--text-primary);">${message}</div>
      `;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 4500);
    }

    function showGlobalErrorBanner(msg) {
      const banner = document.getElementById('global-error-banner');
      const textElem = document.getElementById('global-error-banner-text');
      if (banner && textElem) {
        textElem.textContent = msg;
        banner.style.display = 'flex';
      }
    }

    function generateUuid() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = (Math.random() * 16) | 0;
        const v = c === 'x' ? r : (r & 0x3) | 0x8;
        return v.toString(16);
      });
    }

    /* ==========================================================================
       COMUNICAÇÃO SEGURA COM O SERVIDOR (google.script.run)
       ========================================================================== */

    function callServer(methodName, payload = null, loadingMsg = 'Carregando...') {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          console.warn(`[DEV MOCK] Chamada '${methodName}' executada fora do ambiente GAS.`);
          reject(new Error('Ambiente Google Apps Script não detectado.'));
          return;
        }

        resetIdleTimer(); // Qualquer chamada de rede conta como atividade do militar

        showLoading(loadingMsg);

        // Injeção automática da credencial de sessão do militar no payload
        let finalPayload = payload;
        const currentSessionRe = (state.user && state.user.sessionRe) 
          || (state.user && state.user.militar && (state.user.militar.re || state.user.militar.militar_id))
          || sessionStorage.getItem('sisfolgas_session_re');
        const currentToken = sessionStorage.getItem('sisfolgas_session_token');

        if (finalPayload && typeof finalPayload === 'object' && !Array.isArray(finalPayload)) {
          if (!finalPayload.sessionRe && currentSessionRe) {
            finalPayload.sessionRe = currentSessionRe;
          }
          if (!finalPayload.sessionToken && currentToken) {
            finalPayload.sessionToken = currentToken;
          }
        } else if (finalPayload === null && currentSessionRe) {
          finalPayload = { sessionRe: currentSessionRe, sessionToken: currentToken };
        }

        const runner = google.script.run
          .withSuccessHandler((response) => {
            hideLoading();
            if (response && response.success) {
              resolve(response.data);
            } else {
              const errMsg = (response && response.error && response.error.message) 
                ? response.error.message 
                : 'Falha na resposta do servidor.';
              showToast(errMsg, 'error');
              reject(new Error(errMsg));
            }
          })
          .withFailureHandler((err) => {
            hideLoading();
            const errMsg = err.message || 'Erro inesperado de comunicação com o servidor.';
            showToast(errMsg, 'error');
            reject(err);
          });

        if (finalPayload !== null && finalPayload !== undefined) {
          runner[methodName](finalPayload);
        } else {
          runner[methodName]();
        }
      });
    }

    /* ==========================================================================
       CARREGAMENTO DE DADOS E RENDERIZAÇÃO
       ========================================================================== */

    function updateUnidadeDropdowns(unidades) {
      if (!unidades || !Array.isArray(unidades)) return;
      const qSelect = document.getElementById('select-unidade-queue');
      const mSelect = document.getElementById('select-unidade-militares');
      const currentQ = qSelect ? qSelect.value : 'TODAS';
      const currentM = mSelect ? mSelect.value : 'TODAS';

      const optionsHtml = '<option value="TODAS">Todas as Unidades</option>' + 
        unidades.map(u => `<option value="${u}">${u}</option>`).join('');

      if (qSelect) {
        qSelect.innerHTML = optionsHtml;
        qSelect.value = (unidades.includes(currentQ) || currentQ === 'TODAS') ? currentQ : 'TODAS';
      }
      if (mSelect) {
        mSelect.innerHTML = optionsHtml;
        mSelect.value = (unidades.includes(currentM) || currentM === 'TODAS') ? currentM : 'TODAS';
      }
    }

    async function loadInitialState() {
      let data = null;
      try {
        const savedRe = sessionStorage.getItem('sisfolgas_session_re') || null;
        const savedToken = sessionStorage.getItem('sisfolgas_session_token') || null;
        const payload = {
          sessionRe: savedRe,
          sessionToken: savedToken,
          unidade: state.selectedUnidade !== 'TODAS' ? state.selectedUnidade : null,
          unidadeFilter: state.selectedUnidade !== 'TODAS' ? state.selectedUnidade : null
        };
        data = await callServer('apiGetInitialState', payload, 'Carregando dados do SisFolgas...');
      } catch (err) {
        console.error('Erro ao comunicar com o servidor SisFolgas:', err);
        const errMsg = err && err.message ? err.message : 'Falha ao conectar com o banco de dados da Planilha.';
        showGlobalErrorBanner(errMsg);
      }

      if (data) {
        state.militares = data.militares || [];
        state.activePeriod = data.activePeriod || null;
        state.queues = data.queues || {};
        state.choiceWindow = data.choiceWindow || { isOpen: true, currentDay: (new Date()).getDate() };
        state.spreadsheetUrl = data.spreadsheetUrl || '';

        if (data.unidades && data.unidades.length > 0) {
          updateUnidadeDropdowns(data.unidades);
        }

        const preCadCard = document.getElementById('pre-cadastro-card');
        if (preCadCard) preCadCard.style.display = 'none';

        if (!data.authenticated) {
          state.authenticated = false;
          state.user = null;
          sessionStorage.removeItem('sisfolgas_session_re');
          sessionStorage.removeItem('sisfolgas_last_activity');
          sessionStorage.removeItem('sisfolgas_session_token');
          try { localStorage.removeItem('sisfolgas_session_re'); } catch(e) {}

          const loginScreen = document.getElementById('login-screen');
          const appContainer = document.getElementById('app-container');
          if (appContainer) appContainer.style.display = 'none';
          if (loginScreen) {
            loginScreen.style.display = 'flex';
            const errElem = document.getElementById('login-screen-error');
            if (errElem) {
              errElem.textContent = 'Sessão expirada ou militar não localizado. Identifique-se com seu RE.';
              errElem.style.display = 'flex';
            }
          }
          return;
        } else {
          state.authenticated = true;
          state.user = data.user;
          resetIdleTimer();
          const loginScreen = document.getElementById('login-screen');
          const appContainer = document.getElementById('app-container');
          if (loginScreen) loginScreen.style.display = 'none';
          if (appContainer) appContainer.style.display = 'block';

          if (state.user && state.user.militar) {
            const teamVal = state.user.militar.prontidao || state.user.militar.equipe;
            if (teamVal) {
              state.selectedTeam = teamVal;
              document.querySelectorAll('#team-selector-buttons button').forEach(b => {
                if (b.getAttribute('data-team') === teamVal) b.classList.add('active-team');
                else b.classList.remove('active-team');
              });
            }
          }
        }
      }

      // Renderizações isoladas de alta resiliência (nenhuma falha impede as outras de rodarem)
      try { renderUserInfo(); } catch (e) { console.error('Erro em renderUserInfo:', e); }
      try { renderWindowBanner(); } catch (e) { console.error('Erro em renderWindowBanner:', e); }
      try { renderKpis(); } catch (e) { console.error('Erro em renderKpis:', e); }
      try { renderRolePermissions(); } catch (e) { console.error('Erro em renderRolePermissions:', e); }
      try { renderTeamQueue(); } catch (e) { console.error('Erro em renderTeamQueue:', e); }
      try { renderChoiceTab(); } catch (e) { console.error('Erro em renderChoiceTab:', e); }
      try { renderMilitaresList(); } catch (e) { console.error('Erro em renderMilitaresList:', e); }

      if (state.user && (state.user.perfil === 'ADMIN' || state.user.perfil === 'GESTOR')) {
        try { loadPendingAccumulateRequests(); } catch (e) {}
        try { loadPendingSwaps(); } catch (e) {}
        try { populateNaoFazJusMilitaries(); } catch (e) {}
      }
    }

    function renderUserInfo() {
      const user = state.user;
      const nameElem = document.getElementById('user-display-name');
      const badgeElem = document.getElementById('user-role-badge');
      const btnLogout = document.getElementById('btn-header-logout');
      const btnAltSenha = document.getElementById('btn-header-alterar-senha');
      const btnLogin = document.getElementById('btn-header-login');

      if (!user || !state.authenticated) {
        if (nameElem) nameElem.textContent = 'Não identificado (RE / Senha)';
        if (badgeElem) {
          badgeElem.textContent = 'VISITANTE';
          badgeElem.className = 'user-role-tag role-visitante';
          badgeElem.style.display = 'inline-block';
        }
        if (btnLogout) btnLogout.style.display = 'none';
        if (btnAltSenha) btnAltSenha.style.display = 'none';
        if (btnLogin) {
          btnLogin.style.display = 'inline-flex';
          btnLogin.textContent = '🔓 Entrar com RE';
        }
        return;
      }

      if (user.militar) {
        const m = user.militar;
        const grad = m.graduacao ? `${String(m.graduacao).trim()} ` : '';
        
        let reStr = String(m.re || m.militar_id || '').trim();
        let digitoStr = (m.digito_re !== undefined && m.digito_re !== null && String(m.digito_re).trim() !== '') ? String(m.digito_re).trim() : '';
        
        // Se reStr já contiver hífen (ex: 108154-3), não duplica dígito
        let reFormat = reStr;
        if (!reFormat.includes('-') && digitoStr) {
          reFormat = `${reFormat}-${digitoStr}`;
        }
        
        const nomeGuerra = String(m.nome_guerra || '').trim();
        const unidade = String(m.unidade || '703152301 - EB SÃO ROQUE').trim();
        
        // PADRÃO EXATO SOLICITADO:
        // graduacao  re+dig nome de guerra - unidade  e prontidao com badge com a cor da equipe
        // Exemplo: 1º Sgt PM 108154-3 Andre Dias - 703152301 - EB SÃO ROQUE - VERDE
        // RETIRAR O BADGE "MILITAR"
        const prefix = `${grad}${reFormat} ${nomeGuerra}`.trim();
        if (nameElem) {
          nameElem.textContent = `${prefix} - ${unidade} -`;
        }

        const pRaw = String(m.prontidao || m.equipe || 'Verde').replace(/prontid[aã]o/gi, '').trim();
        const pUpper = pRaw.toUpperCase() || 'VERDE';
        const pLower = pRaw.toLowerCase();

        let badgeClass = 'user-role-tag badge-prontidao-verde';
        if (pLower.includes('amarel')) {
          badgeClass = 'user-role-tag badge-prontidao-amarela';
        } else if (pLower.includes('azul')) {
          badgeClass = 'user-role-tag badge-prontidao-azul';
        }

        if (badgeElem) {
          badgeElem.textContent = pUpper;
          badgeElem.className = badgeClass;
          badgeElem.style.display = 'inline-block';
        }
      } else {
        if (nameElem) {
          nameElem.textContent = user.email || 'Administrador';
        }
        if (badgeElem) {
          if (user.isOwner) {
            badgeElem.textContent = 'ADMIN (DONO DA PLANILHA)';
            badgeElem.className = 'user-role-tag role-admin';
          } else {
            badgeElem.textContent = (user.perfil || 'ADMIN').toUpperCase();
            badgeElem.className = `user-role-tag role-${String(user.perfil || 'admin').toLowerCase()}`;
          }
          badgeElem.style.display = 'inline-block';
        }
      }

      if (btnLogout) btnLogout.style.display = 'inline-flex';
      if (btnAltSenha) btnAltSenha.style.display = 'inline-flex';
      if (btnLogin) {
        btnLogin.style.display = 'inline-flex';
        btnLogin.textContent = '🔄 Trocar RE';
      }
    }

    function renderMilitaresList() {
      const tbody = document.getElementById('militares-table-body');
      if (!tbody) return;

      const filterProntidao = state.militarFilter || 'TODAS';
      const filterUnidade = state.selectedUnidade || 'TODAS';
      const search = (state.militarSearch || '').toLowerCase().trim();

      // 1. Ordem oficial inicial: Lista de antiguidade geral do mais antigo até o mais novo (Coluna J)
      let list = [...(state.militares || [])].sort((a, b) => {
        const orderA = Number(a.ordem_antiguidade) || 999;
        const orderB = Number(b.ordem_antiguidade) || 999;
        return orderA - orderB;
      });

      // 2. Primeiro filtro: Coluna G (Unidade)
      if (filterUnidade !== 'TODAS') {
        list = list.filter(m => (m.unidade || '').toUpperCase() === filterUnidade.toUpperCase());
      }

      // 3. Segundo filtro: Coluna I (Prontidão: Verde, Amarela, Azul)
      if (filterProntidao !== 'TODAS') {
        list = list.filter(m => {
          const p = (m.prontidao || m.equipe || '').toLowerCase();
          const target = filterProntidao.toLowerCase();
          return p === target || p.includes(target);
        });
      }

      // 4. Filtro textual por busca (RE, Nome de Guerra, Graduação, Nome Completo)
      if (search) {
        list = list.filter(m => {
          const re = String(m.re || '').toLowerCase();
          const nomeGuerra = (m.nome_guerra || '').toLowerCase();
          const grad = (m.graduacao || '').toLowerCase();
          const nomeCompleto = (m.nome_completo || '').toLowerCase();
          const unidade = (m.unidade || '').toLowerCase();
          return re.includes(search) || nomeGuerra.includes(search) || grad.includes(search) || nomeCompleto.includes(search) || unidade.includes(search);
        });
      }

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-muted);">Nenhum militar encontrado para os filtros selecionados.</td></tr>`;
        return;
      }

      const currentLoggedRe = (state.user && state.user.militar && (state.user.militar.re || state.user.militar.militar_id)) || '';

      tbody.innerHTML = list.map(m => {
        const displayRe = m.re || m.militar_id || '--';
        const displayDigito = m.digito_re ? '-' + m.digito_re : '';
        const isCurrentSession = (currentLoggedRe && String(currentLoggedRe) === String(displayRe));
        const prontidaoNome = m.prontidao || m.equipe || 'Verde';
        const situacaoNome = m.situacao || 'ATIVO';
        const unidadeNome = m.unidade || '1º SGB';

        let badgeProntClass = 'badge-prontidao-verde';
        if (prontidaoNome.toLowerCase().includes('amarel')) badgeProntClass = 'badge-prontidao-amarela';
        else if (prontidaoNome.toLowerCase().includes('azul')) badgeProntClass = 'badge-prontidao-azul';

        let badgeSitClass = 'status-badge badge-escolhido';
        if (situacaoNome !== 'ATIVO') badgeSitClass = 'status-badge badge-nao-faz-jus';

        let actionHtml = '';
        if (isCurrentSession) {
          actionHtml = `
            <div style="display: flex; gap: 0.35rem; justify-content: center; align-items: center;">
              <span style="background: rgba(16, 185, 129, 0.2); color: #34d399; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(16, 185, 129, 0.4);">
                ✅ Logado
              </span>
              <button class="btn btn-secondary" style="font-size: 0.74rem; padding: 3px 8px;" onclick="App.abrirModalAlterarSenha('${displayRe}')">
                🔑 Senha
              </button>
            </div>
          `;
        } else {
          actionHtml = `
            <div style="display: flex; gap: 0.35rem; justify-content: center; align-items: center;">
              <button class="btn btn-primary" style="font-size: 0.74rem; padding: 3px 8px; background: linear-gradient(135deg, #4f46e5, #6366f1);" onclick="App.entrarComMilitarRe('${displayRe}')" title="Acessar sessão como este militar">
                🔓 Entrar
              </button>
              <button class="btn btn-secondary" style="font-size: 0.74rem; padding: 3px 8px;" onclick="App.abrirModalAlterarSenha('${displayRe}')" title="Alterar senha do militar">
                🔑 Senha
              </button>
            </div>
          `;
        }

        return `
          <tr class="${isCurrentSession ? 'highlight-my-row' : ''}">
            <td>
              <span style="font-family: monospace; font-weight: 700; color: #fff; background: rgba(255,255,255,0.06); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border-subtle);">
                ${displayRe}${displayDigito}
              </span>
            </td>
            <td><strong>${m.graduacao}</strong></td>
            <td>
              <span style="color: #fff; font-weight: 600;">${m.nome_guerra}</span>
              ${m.nome_completo ? `<div style="font-size: 0.75rem; color: var(--text-muted);">${m.nome_completo}</div>` : ''}
            </td>
            <td><span style="color: var(--text-secondary); font-size: 0.85rem;">${unidadeNome}</span></td>
            <td><span class="${badgeSitClass}" style="font-size: 0.75rem;">${situacaoNome}</span></td>
            <td><span class="status-badge ${badgeProntClass}">${prontidaoNome}</span></td>
            <td style="text-align: center; font-weight: 700; color: #f59e0b; font-size: 0.95rem;">${m.ordem_antiguidade}º</td>
            <td style="text-align: center;">${actionHtml}</td>
          </tr>
        `;
      }).join('');
    }

    function renderWindowBanner() {
      const banner = document.getElementById('window-status-banner');
      const icon = document.getElementById('window-banner-icon');
      const title = document.getElementById('window-banner-title');
      const subtext = document.getElementById('window-banner-subtext');
      const tag = document.getElementById('window-banner-tag');

      if (!banner || !state.choiceWindow) return;

      const isOpen = state.choiceWindow.isOpen;

      if (isOpen) {
        banner.className = 'window-banner window-open';
        icon.textContent = '📅';
        title.textContent = 'Janela Oficial de Escolha: 01 a 16 de cada mês';
        subtext.textContent = 'O sistema está aberto para escolhas da vez e trocas/permutas após a conclusão da escala pela equipe.';
        tag.className = 'window-banner-tag tag-open';
        tag.textContent = 'Janela Aberta';
      } else {
        banner.className = 'window-banner window-blocked';
        icon.textContent = '🔒';
        title.textContent = 'Sistema Bloqueado para Edição (Dias 17 ao fim do mês)';
        subtext.textContent = 'Período regulamentar de escolha encerrado. O sistema está em modo somente leitura até o dia 1º da próxima competência.';
        tag.className = 'window-banner-tag tag-blocked';
        tag.textContent = 'Edição Bloqueada';
      }
    }

    function renderRolePermissions() {
      const user = state.user || {};
      const perfil = user.perfil || '';
      const isOwner = Boolean(user.isOwner);
      const tabGestor = document.getElementById('btn-tab-gestor');
      const tabAdmin = document.getElementById('btn-tab-admin');

      const isAdmin = (perfil === 'ADMIN' || isOwner);
      if (isAdmin) {
        if (tabGestor) tabGestor.style.display = 'block';
        if (tabAdmin) tabAdmin.style.display = 'block';
      } else if (perfil === 'GESTOR') {
        if (tabGestor) tabGestor.style.display = 'block';

    function renderKpis() {
      const p = state.activePeriod;
      const m = state.user ? state.user.militar : null;
      const myTeam = m ? (m.prontidao || m.equipe) : state.selectedTeam;
      const queue = state.queues[myTeam] || state.queues[state.selectedTeam];

      // KPI Competência
      const compElem = document.getElementById('kpi-competencia');
      const perStatusElem = document.getElementById('kpi-periodo-status');
      if (compElem) compElem.textContent = p ? formatCompetencia(p.competencia) : 'Nenhum';
      if (perStatusElem) perStatusElem.textContent = p ? `Período ${p.status}` : 'Sem período aberto';

      // KPI Minha Equipe
      const teamElem = document.getElementById('kpi-equipe');
      const antigElem = document.getElementById('kpi-antiguidade');
      if (teamElem) teamElem.textContent = myTeam || '--';
      if (antigElem) antigElem.textContent = m ? `Antiguidade Oficial: ${m.ordem_antiguidade}º` : 'Perfil Administrativo';

      // KPI Minha Situação
      const myRow = (queue && m && queue.fila) ? queue.fila.find(f => String(f.militar_id) === String(m.militar_id || m.re) || String(f.re) === String(m.re)) : null;
      const statusElem = document.getElementById('kpi-status-escolha');
      const dataFolgaElem = document.getElementById('kpi-data-folga');

      if (myRow) {
        if (myRow.status_fila === 'ESCOLHIDO') {
          if (statusElem) { statusElem.textContent = 'FOLGA CONFIRMADA'; statusElem.style.color = 'var(--status-success)'; }
          if (dataFolgaElem) dataFolgaElem.textContent = `Plantão: ${formatDate(myRow.data_folga)}`;
          state.myChoice = myRow;
        } else if (myRow.status_fila === 'SUA_VEZ') {
          if (statusElem) { statusElem.textContent = 'É A SUA VEZ!'; statusElem.style.color = 'var(--brand-red)'; }
          if (dataFolgaElem) dataFolgaElem.textContent = 'Selecione uma data disponível';
          state.myChoice = null;
        } else if (myRow.status_fila === 'PASSOU') {
          if (statusElem) { statusElem.textContent = 'VEZ PASSADA'; statusElem.style.color = 'var(--status-warning)'; }
          if (dataFolgaElem) dataFolgaElem.textContent = 'Prazo expirado ou justificado';
        } else if (myRow.status_fila === 'NAO_FAZ_JUS') {
          if (statusElem) { statusElem.textContent = 'NÃO FAZ JUS'; statusElem.style.color = 'var(--brand-amber)'; }
          if (dataFolgaElem) dataFolgaElem.textContent = myRow.motivo_nao_faz_jus || 'Afastamento regulamentar';
        } else if (myRow.status_fila === 'ACUMULADO') {
          if (statusElem) { statusElem.textContent = 'FOLGA ACUMULADA'; statusElem.style.color = '#c084fc'; }
          if (dataFolgaElem) dataFolgaElem.textContent = 'Convertida em +1 crédito futuro';
        } else if (myRow.status_fila === 'PENDENTE_VALIDACAO') {
          if (statusElem) { statusElem.textContent = 'ACÚMULO PENDENTE'; statusElem.style.color = '#c084fc'; }
          if (dataFolgaElem) dataFolgaElem.textContent = 'Aguardando validação do Administrador';
        } else {
          if (statusElem) { statusElem.textContent = 'AGUARDANDO VEZ'; statusElem.style.color = 'var(--text-secondary)'; }
          if (dataFolgaElem) dataFolgaElem.textContent = 'Aguarde os militares mais antigos';
        }
      } else {
        if (statusElem) { statusElem.textContent = p ? 'AGUARDANDO VEZ' : 'SEM PERÍODO'; statusElem.style.color = 'var(--text-secondary)'; }
        if (dataFolgaElem) dataFolgaElem.textContent = p ? 'Aguarde sua posição na escala' : 'Aguardando abertura de competência';
      }

      // KPI Vagas Restantes
      const vagasElem = document.getElementById('kpi-vagas-restantes');
      const proxElem = document.getElementById('kpi-proximo-vez');
      if (vagasElem) {
        vagasElem.textContent = queue ? `${queue.vagas_restantes} vagas` : (p ? '0 vagas' : 'Período Fechado');
      }
      if (proxElem) {
        if (queue && queue.proximo_da_vez) {
          proxElem.textContent = `Vez de: ${queue.proximo_da_vez.graduacao} ${queue.proximo_da_vez.nome_guerra}`;
        } else if (queue && queue.vagas_restantes === 0) {
          proxElem.textContent = 'Todas as escolhas concluídas';
        } else {
          proxElem.textContent = p ? 'Fila em processamento' : 'Aguardando abertura';
        }
      }
    }

    function renderChoiceTab() {
      const banner = document.getElementById('choice-banner');
      const bannerTitle = document.getElementById('choice-banner-title');
      const bannerDesc = document.getElementById('choice-banner-desc');
      const btnConfirmar = document.getElementById('btn-confirmar-escolha');
      const btnAcumulo = document.getElementById('btn-solicitar-acumulo');
      const confirmedBox = document.getElementById('confirmed-choice-box');
      const datesContainer = document.getElementById('eligible-dates-container');

      const m = state.user ? state.user.militar : null;
      if (!m) {
        if (bannerTitle) bannerTitle.textContent = 'Perfil de Acesso Administrativo';
        if (bannerDesc) bannerDesc.textContent = 'Use as abas Painel Operacional ou Administração para gerenciar as equipes.';
        if (btnConfirmar) btnConfirmar.style.display = 'none';
        if (btnAcumulo) btnAcumulo.style.display = 'none';
        return;
      }

      // Se não houver período aberto no momento:
      if (!state.activePeriod) {
        if (banner) {
          banner.style.display = 'flex';
          banner.className = 'turn-banner waiting';
        }
        if (confirmedBox) confirmedBox.style.display = 'none';
        if (bannerTitle) bannerTitle.innerHTML = '📅 Nenhum Período de Escolha Aberto no Momento';
        if (bannerDesc) bannerDesc.textContent = 'Aguarde a administração abrir a competência (ex: NOV26) na aba Administração para liberar a escolha de folgas.';
        if (btnConfirmar) {
          btnConfirmar.style.display = 'inline-flex';
          btnConfirmar.disabled = true;
          btnConfirmar.textContent = 'Escolha Bloqueada (Sem Período)';
        }
        if (btnAcumulo) btnAcumulo.style.display = 'none';
        if (datesContainer) {
          datesContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2.5rem; color: var(--text-muted); font-size: 0.95rem;">Os dias de plantão 24x48 da sua prontidão estarão disponíveis para marcação assim que a competência for aberta pelo Administrador.</div>';
        }
        return;
      }

      const myTeam = m.prontidao || m.equipe || state.selectedTeam;
      const queue = state.queues[myTeam] || state.queues[m.equipe] || state.queues[m.prontidao];
      if (!queue) return;

      const myRow = queue.fila.find(f => f.militar_id === m.militar_id);
      const isMyTurn = (myRow && myRow.status_fila === 'SUA_VEZ');
      const hasChosen = (myRow && myRow.status_fila === 'ESCOLHIDO');
      const isWindowOpen = state.choiceWindow && state.choiceWindow.isOpen;
      // Botões e status da fase de trocas
      const swapBadge = document.getElementById('swap-phase-badge');
      const swapSubtitle = document.getElementById('swap-phase-subtitle');
      const btnTrocaVaga = document.getElementById('btn-abrir-troca-vaga');
      const btnPermuta = document.getElementById('btn-abrir-permuta');
      const pendingBox = document.getElementById('pending-accumulation-box');

      const isPendingValidation = (myRow && myRow.status_fila === 'PENDENTE_VALIDACAO');

      if (isPendingValidation) {
        banner.style.display = 'none';
        confirmedBox.style.display = 'none';
        if (pendingBox) pendingBox.style.display = 'block';
      } else {
        if (pendingBox) pendingBox.style.display = 'none';

        if (hasChosen) {
          banner.style.display = 'none';
          confirmedBox.style.display = 'block';
          document.getElementById('confirmed-date-display').textContent = formatDate(myRow.data_folga);

          // Verifica liberação da Fase de Trocas (após todos escolherem)
          if (queue.fase_trocas_liberada) {
            swapBadge.className = 'status-badge badge-escolhido';
            swapBadge.textContent = 'Liberada para a Equipe';
            swapSubtitle.textContent = isWindowOpen
              ? 'Todos os militares da sua prontidão concluíram a escolha inicial! Você pode transferir sua data para outro dia vago ou permutar diretamente com um colega.'
              : 'Fase de trocas concluída. O sistema está bloqueado para edições entre o dia 17 e o final do mês.';

            btnTrocaVaga.disabled = !isWindowOpen;
            btnPermuta.disabled = !isWindowOpen;
          } else {
            swapBadge.className = 'status-badge badge-aguardando';
            swapBadge.textContent = 'Aguardando Restante da Equipe';
            swapSubtitle.textContent = 'A fase de trocas e permutas será liberada automaticamente assim que todos os militares da sua equipe concluírem suas escolhas.';
            btnTrocaVaga.disabled = true;
            btnPermuta.disabled = true;
          }
        } else {
          confirmedBox.style.display = 'none';
          banner.style.display = 'flex';

        if (isMyTurn) {
          banner.className = 'turn-banner';
          bannerTitle.innerHTML = '<span class="pulse-indicator"></span> É A SUA VEZ DE ESCOLHER!';
          bannerDesc.textContent = isWindowOpen
            ? 'Você é o militar mais antigo pendente na sua equipe. Escolha uma das datas de plantão abaixo ou opte por acumular para outro mês.'
            : 'É a sua vez na escala, porém o sistema encontra-se bloqueado para edições (dias 17 ao fim do mês).';

          btnConfirmar.style.display = 'inline-flex';
          btnConfirmar.disabled = !state.selectedDate || !isWindowOpen;

          btnAcumulo.style.display = 'inline-flex';
          btnAcumulo.disabled = !isWindowOpen;
        } else {
          banner.className = 'turn-banner waiting';
          bannerTitle.innerHTML = 'Aguardando sua vez na fila...';
          const prox = queue.proximo_da_vez;
          bannerDesc.textContent = prox 
            ? `Atualmente a vez é de: ${prox.graduacao} ${prox.nome_guerra} (${prox.posicao}º da fila).` 
            : (queue.vagas_restantes === 0 ? 'Todas as escolhas da equipe foram concluídas.' : 'Fila aguardando liberação.');
          btnConfirmar.disabled = true;
          btnAcumulo.style.display = 'none';
        }
      }

      renderDateGrid(queue, isMyTurn && isWindowOpen);
    }
  }

  function renderDateGrid(queue, isInteractive) {
      const container = document.getElementById('eligible-dates-container');
      if (!container) return;
      container.innerHTML = '';

      const allDates = [...queue.datas_disponiveis, ...queue.datas_ocupadas].sort();

      allDates.forEach(dateStr => {
        const isOccupied = queue.datas_ocupadas.includes(dateStr);
        const card = document.createElement('div');
        const isSelected = (state.selectedDate === dateStr);

        card.className = `date-card ${isOccupied ? 'disabled' : ''} ${isSelected ? 'selected' : ''}`;
        
        const dateObj = new Date(dateStr + 'T12:00:00Z');
        const dayOfWeek = dateObj.toLocaleDateString('pt-BR', { weekday: 'short', timeZone: 'UTC' }).replace('.', '');
        const dayNumber = dateStr.split('-')[2];

        card.innerHTML = `
          <div class="date-day-name">${dayOfWeek}</div>
          <div class="date-number">${dayNumber}</div>
          <span class="date-status-tag ${isOccupied ? 'date-taken' : 'date-available'}">
            ${isOccupied ? 'Ocupada' : 'Disponível'}
          </span>
        `;

        if (!isOccupied && isInteractive) {
          card.onclick = () => {
            state.selectedDate = dateStr;
            document.querySelectorAll('.date-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            document.getElementById('btn-confirmar-escolha').disabled = false;
          };
        }

        container.appendChild(card);
      });
    }

    function formatDate(isoStr) {
      if (!isoStr || isoStr === 'PASSOU_A_VEZ' || isoStr === 'NAO_FAZ_JUS') return isoStr || '--';
      const parts = isoStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return isoStr;
    }

    function formatCompetencia(comp) {
      if (!comp || comp === '--') return '--';

      // Se for objeto Date
      if (comp instanceof Date && !isNaN(comp.getTime())) {
        const months = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
        const month = months[comp.getMonth()];
        const year = String(comp.getFullYear()).slice(-2);
        return `${month}${year}`;
      }

      const str = String(comp).trim().toUpperCase();

      // 1. Formato militar direto (ex: NOV26, NOV/26, NOV-26, NOV 26, NOV/2026)
      const milMatch = str.match(/(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)[\s\/\-\.]*(\d{2,4})/);
      if (milMatch) {
        return `${milMatch[1]}${milMatch[2].slice(-2)}`;
      }

      // 2. Meses por extenso em português
      const fullMonths = {
        'JANEIRO': 'JAN', 'FEVEREIRO': 'FEV', 'MARCO': 'MAR', 'MARÇO': 'MAR',
        'ABRIL': 'ABR', 'MAIO': 'MAI', 'JUNHO': 'JUN', 'JULHO': 'JUL',
        'AGOSTO': 'AGO', 'SETEMBRO': 'SET', 'OUTUBRO': 'OUT', 'NOVEMBRO': 'NOV', 'DEZEMBRO': 'DEZ'
      };
      for (const [full, abbr] of Object.entries(fullMonths)) {
        if (str.includes(full)) {
          const yearMatch = str.match(/\d{2,4}/);
          const y = yearMatch ? yearMatch[0].slice(-2) : '26';
          return `${abbr}${y}`;
        }
      }

      const months = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

      // 3. Formato ISO YYYY-MM ou YYYY-MM-DD (ex: 2026-11-26 -> NOV26, 2026-11 -> NOV26)
      const isoMatch = str.match(/^(\d{4})-(0[1-9]|1[0-2])/);
      if (isoMatch) {
        const y = isoMatch[1].slice(-2);
        const mIdx = parseInt(isoMatch[2], 10) - 1;
        return `${months[mIdx]}${y}`;
      }

      // 4. Formato brasileiro DD/MM/YYYY ou MM/YYYY ou MM/YY (ex: 26/11/2026 -> NOV26)
      const brMatch = str.match(/(?:(\d{1,2})[\/\-\.])?(0[1-9]|1[0-2])[\/\-\.](\d{2,4})/);
      if (brMatch) {
        const mIdx = parseInt(brMatch[2], 10) - 1;
        const y = brMatch[3].slice(-2);
        return `${months[mIdx]}${y}`;
      }

      return str;
    }

    async function loadPendingAccumulateRequests() {
      try {
        const tbody = document.getElementById('pending-accumulate-table-body');
        if (!tbody) return;

        const requests = await callServer('apiAdminGetPendingAccumulateRequests', null, 'Consultando acúmulos pendentes...');
        const count = (requests && requests.length) || 0;

        // Atualiza Badge na aba Painel Operacional
        const badge = document.getElementById('badge-pending-accumulate');
        if (badge) {
          if (count > 0) {
            badge.textContent = count;
            badge.style.display = 'inline-block';
          } else {
            badge.style.display = 'none';
          }
        }

        // Atualiza Alerta no Topo para Administrador / Gestor
        const alertBanner = document.getElementById('admin-pending-alert');
        const alertSubtext = document.getElementById('admin-pending-subtext');
        if (alertBanner) {
          const isPrivileged = state.user && (state.user.perfil === 'ADMIN' || state.user.perfil === 'GESTOR');
          if (count > 0 && isPrivileged) {
            alertBanner.style.display = 'flex';
            if (alertSubtext) {
              alertSubtext.textContent = `Existe(m) ${count} militar(es) aguardando homologação formal para acumular a folga.`;
            }
          } else {
            alertBanner.style.display = 'none';
          }
        }

        if (!requests || requests.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 1.75rem;">Nenhuma solicitação de acúmulo pendente no momento.</td></tr>';
          return;
        }

        tbody.innerHTML = requests.map(r => `
          <tr>
            <td><strong>${r.militar_nome || (r.graduacao + ' ' + r.nome_guerra) || r.militar_id}</strong></td>
            <td>${r.equipe || '--'}</td>
            <td><code>${formatCompetencia(r.competencia)}</code></td>
            <td style="font-size: 0.85rem; color: var(--text-secondary);">${r.justificativa || '--'}</td>
            <td style="font-size: 0.8rem;">${new Date(r.criado_em || r.data_criacao || Date.now()).toLocaleDateString('pt-BR')}</td>
            <td style="text-align: center;">
              <div style="display: flex; gap: 0.5rem; justify-content: center;">
                <button class="btn btn-primary" style="padding: 0.35rem 0.75rem; font-size: 0.78rem; background: #10b981; border-color: #059669;" onclick="App.approveAccumulate('${r.escolha_id}')">✓ Aprovar</button>
                <button class="btn btn-danger" style="padding: 0.35rem 0.75rem; font-size: 0.78rem;" onclick="App.openRejectAccumulate('${r.escolha_id}')">✕ Recusar</button>
              </div>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Erro ao buscar acúmulos:', err);
      }
    }

    function populateNaoFazJusMilitaries() {
      const teamSelect = document.getElementById('nao-faz-jus-team-select');
      const milSelect = document.getElementById('nao-faz-jus-militar-select');
      if (!teamSelect || !milSelect) return;

      const team = teamSelect.value;
      const queue = state.queues[team];
      if (!queue || !queue.fila) {
        milSelect.innerHTML = '<option value="">Sem militares nesta equipe</option>';
        return;
      }

      milSelect.innerHTML = queue.fila.map(f => `
        <option value="${f.militar_id}">
          ${f.posicao}º - ${f.graduacao} ${f.nome_guerra} (${f.status_fila})
        </option>
      `).join('');

    function setupTabNavigation() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

          btn.classList.add('active');
          const target = document.getElementById(btn.getAttribute('data-tab'));
          if (target) target.classList.add('active');

          if (btn.getAttribute('data-tab') === 'tab-gestor') {
            loadPendingAccumulateRequests();
            loadPendingSwaps();
            populateNaoFazJusMilitaries();
          }

          if (btn.getAttribute('data-tab') === 'tab-militares') {
            renderMilitaresList();
          }
        });
      });
    }

    async function vincularMeuGoogle(re, nomeGuerra) {
      const email = state.user ? state.user.email : '';
      if (!email || email.includes('Não Vinculada') || email.includes('Não Identificado')) {
        const inputEmail = prompt(`Informe a sua conta Google (Gmail) para vincular ao militar ${nomeGuerra} (RE: ${re}):`);
        if (!inputEmail) return;
        try {
          await callServer('apiLinkGoogleToMilitary', { re: re, email: inputEmail.trim() }, 'Vinculando conta Google ao militar...');
          showToast(`Conta Google vinculada com sucesso ao RE ${re} (${nomeGuerra})!`, 'success');
          await loadInitialState();
        } catch (e) {}
        return;
      }

      if (!confirm(`Confirma vincular a sua conta Google conectada (${email}) ao militar ${nomeGuerra} (RE: ${re})?`)) {
        return;
      }

      try {
        await callServer('apiLinkGoogleToMilitary', { re: re, email: email }, 'Vinculando conta Google ao militar...');
        showToast(`Conta Google vinculada com sucesso ao RE ${re} (${nomeGuerra})!`, 'success');
        await loadInitialState();
      } catch (e) {}
    }

    async function vincularMilitar(re, nomeGuerra) {
      const novoEmail = prompt(`Informe o e-mail Google para vincular ao militar ${nomeGuerra} (RE: ${re}):`);
      if (!novoEmail) return;

      try {
        await callServer('apiLinkGoogleToMilitary', { re: re, email: novoEmail.trim() }, 'Atualizando vínculo de e-mail...');
        showToast(`E-mail ${novoEmail} vinculado com sucesso ao RE ${re}!`, 'success');
        await loadInitialState();
      } catch (e) {}
    }

    async function submitPreCadastro() {
      const reInput = document.getElementById('pre-cad-re');
      const nomeInput = document.getElementById('pre-cad-nome');
      const statusSpan = document.getElementById('pre-cad-status');
      const btnSubmit = document.getElementById('btn-submit-pre-cadastro');

      const re = (reInput.value || '').trim();
      const nome = (nomeInput.value || '').trim();

      if (!re || !nome) {
        showToast('Informe o RE e o Nome para realizar a ativação do seu acesso.', 'warning');
        return;
      }

      try {
        btnSubmit.disabled = true;
        statusSpan.style.display = 'inline';
        statusSpan.style.color = '#818cf8';
        statusSpan.textContent = 'Verificando cadastro militar no banco de dados...';

        const res = await callServer('apiPreCadastroMilitar', { re: re, nome: nome }, 'Validando cadastro militar...');

        statusSpan.style.color = '#34d399';
        statusSpan.textContent = res.mensagem || 'Acesso ativado com sucesso!';
        showToast(res.mensagem || 'Acesso ativado com sucesso!', 'success');

        // Recarrega o estado do sistema e atualiza todas as visualizações
        setTimeout(async () => {
          await loadInitialState();
        }, 600);

      } catch (err) {
        statusSpan.style.display = 'inline';
        statusSpan.style.color = '#f87171';
        statusSpan.textContent = err.message || 'Falha ao ativar o cadastro.';
      } finally {
        btnSubmit.disabled = false;
      }
    }

    function preencherPreCadastro(re, nomeGuerra) {
      const card = document.getElementById('pre-cadastro-card');
      const reInput = document.getElementById('pre-cad-re');
      const nomeInput = document.getElementById('pre-cad-nome');
      if (card && reInput && nomeInput) {
        card.style.display = 'block';
        reInput.value = re;
        nomeInput.value = nomeGuerra;
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        reInput.focus();
        showToast(`RE ${re} e Nome ${nomeGuerra} preenchidos. Clique em "Ativar Meu Acesso".`, 'info');
      }
    }

    /* ==========================================================================
       AUTENTICAÇÃO POR RE / SENHA E CRUD DE ALTERAÇÃO DE SENHA
       ========================================================================== */

    function abrirModalLogin() {
      const modal = document.getElementById('modal-login');
      const reInput = document.getElementById('login-re');
      const senhaInput = document.getElementById('login-senha');
      const errElem = document.getElementById('login-error-msg');
      if (errElem) errElem.style.display = 'none';
      if (reInput) {
        const currentRe = (state.user && state.user.militar && (state.user.militar.re || state.user.militar.militar_id)) || sessionStorage.getItem('sisfolgas_session_re') || '';
        reInput.value = currentRe;
      }
      if (senhaInput) senhaInput.value = '';
      if (modal) modal.style.display = 'flex';
      setTimeout(() => {
        if (reInput && !reInput.value) reInput.focus();
        else if (senhaInput) senhaInput.focus();
      }, 100);
    }

    function fecharModalLogin() {
      const modal = document.getElementById('modal-login');
      if (modal) modal.style.display = 'none';
    }

    function abrirModalAlterarSenha(targetRe) {
      const modal = document.getElementById('modal-alterar-senha');
      const reInput = document.getElementById('alt-senha-re');
      const atualInput = document.getElementById('alt-senha-atual');
      const novaInput = document.getElementById('alt-senha-nova');
      const confInput = document.getElementById('alt-senha-confirma');
      const errElem = document.getElementById('alt-senha-error-msg');
      if (errElem) errElem.style.display = 'none';

      const currentRe = targetRe || (state.user && state.user.militar && (state.user.militar.re || state.user.militar.militar_id)) || sessionStorage.getItem('sisfolgas_session_re') || '';
      if (reInput) reInput.value = currentRe;
      if (atualInput) atualInput.value = '';
      if (novaInput) novaInput.value = '';
      if (confInput) confInput.value = '';

      if (modal) {
        modal.classList.add('active');
        modal.style.display = 'flex';
      }
      setTimeout(() => {
        if (atualInput) atualInput.focus();
      }, 100);
    }

    function fecharModalAlterarSenha() {
      const modal = document.getElementById('modal-alterar-senha');
      if (modal) {
        modal.classList.remove('active');
        modal.style.display = 'none';
      }
    }

    async function fazerLogin(reParam, senhaParam) {
      const reInput = document.getElementById('login-screen-re') || document.getElementById('login-re');
      const senhaInput = document.getElementById('login-screen-senha') || document.getElementById('login-senha');
      const errElem = document.getElementById('login-screen-error') || document.getElementById('login-error-msg');

      const re = (reParam || (reInput ? reInput.value : '') || '').trim();
      const senhaVal = senhaParam !== undefined ? senhaParam : (senhaInput ? senhaInput.value : '');
      let senha = (senhaVal || '').trim();

      if (errElem) {
        errElem.style.display = 'none';
        errElem.textContent = '';
      }

      if (!re) {
        if (errElem) {
          errElem.textContent = 'Informe o seu número de RE para acessar.';
          errElem.style.display = 'flex';
        }
        return;
      }

      // No formato RE + RE, caso a senha esteja vazia, assume o próprio RE como padrão
      if (!senha) {
        senha = re;
      }

      try {
        showLoading('Validando credenciais do militar...');
        const res = await callServer('apiLogin', { re: re, senha: senha }, 'Autenticando...');
        const resolvedRe = (res && res.militar && (res.militar.re || res.militar.militar_id)) 
          ? (res.militar.re || res.militar.militar_id) 
          : re;
        sessionStorage.setItem('sisfolgas_session_re', resolvedRe);
        sessionStorage.setItem('sisfolgas_last_activity', String(Date.now()));
        if (res && res.sessionToken) {
          sessionStorage.setItem('sisfolgas_session_token', res.sessionToken);
        }
        try { localStorage.removeItem('sisfolgas_session_re'); } catch(e) {}

        if (res && res.user) {
          state.authenticated = true;
          state.user = res.user;
          resetIdleTimer();
        }

        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        if (loginScreen) loginScreen.style.display = 'none';
        if (appContainer) appContainer.style.display = 'block';

        if (senhaInput) senhaInput.value = '';

        const militarNome = (res && res.militar) 
          ? `${res.militar.graduacao || ''} ${res.militar.nome_guerra || resolvedRe}`.trim()
          : resolvedRe;
        showToast(`Bem-vindo, ${militarNome}! Acesso confirmado.`, 'success');

        await loadInitialState();
      } catch (err) {
        if (errElem) {
          errElem.textContent = err.message || 'Falha ao autenticar com o RE fornecido.';
          errElem.style.display = 'flex';
        }
      }
    }

    async function alterarSenha() {
      const re = (document.getElementById('alt-senha-re') ? document.getElementById('alt-senha-re').value : '').trim();
      const senhaAtual = (document.getElementById('alt-senha-atual') ? document.getElementById('alt-senha-atual').value : '').trim();
      const novaSenha = (document.getElementById('alt-senha-nova') ? document.getElementById('alt-senha-nova').value : '').trim();
      const confirmaSenha = (document.getElementById('alt-senha-confirma') ? document.getElementById('alt-senha-confirma').value : '').trim();
      const errElem = document.getElementById('alt-senha-error-msg');

      if (!senhaAtual || !novaSenha || !confirmaSenha) {
        if (errElem) {
          errElem.textContent = 'Preencha todos os campos obrigatórios.';
          errElem.style.display = 'block';
        }
        return;
      }

      if (novaSenha !== confirmaSenha) {
        if (errElem) {
          errElem.textContent = 'A nova senha e a confirmação estão diferentes.';
          errElem.style.display = 'block';
        }
        return;
      }

      if (novaSenha.length < 3) {
        if (errElem) {
          errElem.textContent = 'A nova senha deve ter no mínimo 3 caracteres.';
          errElem.style.display = 'block';
        }
        return;
      }

      try {
        showLoading('Atualizando sua senha no sistema...');
        await callServer('apiAlterarSenha', {
          re: re,
          senhaAtual: senhaAtual,
          novaSenha: novaSenha,
          confirmaSenha: confirmaSenha
        }, 'Gravando senha...');
        fecharModalAlterarSenha();
        showToast('Senha alterada com sucesso! Guarde suas credenciais.', 'success');
      } catch (err) {
        if (errElem) {
          errElem.textContent = err.message || 'Falha ao alterar senha.';
          errElem.style.display = 'block';
        }
      }
    }

    function fazerLogout(motivo) {
      if (idleTimer) clearTimeout(idleTimer);
      if (warningTimer) clearTimeout(warningTimer);
      sessionStorage.removeItem('sisfolgas_session_re');
      sessionStorage.removeItem('sisfolgas_last_activity');
      sessionStorage.removeItem('sisfolgas_session_token');
      try { localStorage.removeItem('sisfolgas_session_re'); } catch(e) {}
      state.authenticated = false;
      state.user = null;

      const appContainer = document.getElementById('app-container');
      const loginScreen = document.getElementById('login-screen');

      if (appContainer) appContainer.style.display = 'none';
      if (loginScreen) {
        loginScreen.style.display = 'flex';
        const senhaInput = document.getElementById('login-screen-senha') || document.getElementById('login-senha');
        if (senhaInput) senhaInput.value = '';
        const errElem = document.getElementById('login-screen-error') || document.getElementById('login-error-msg');
        if (errElem) {
          if (motivo) {
            errElem.textContent = motivo;
            errElem.style.display = 'flex';
          } else {
            errElem.style.display = 'none';
          }
        }
        const reInput = document.getElementById('login-screen-re') || document.getElementById('login-re');
        if (reInput) setTimeout(() => reInput.focus(), 150);
      }

      if (motivo) {
        showToast(motivo, 'error');
      } else {
        showToast('Você encerrou sua sessão com segurança.', 'info');
      }
    }

    function entrarComMilitarRe(re) {
      fazerLogin(re, re);
    }

    return {
      init: init,
      approveAccumulate: approveAccumulate,
      openRejectAccumulate: openRejectAccumulate,
      approveSwap: approveSwap,
      openRejectSwap: openRejectSwap,
      vincularMeuGoogle: vincularMeuGoogle,
      vincularMilitar: vincularMilitar,
      submitPreCadastro: submitPreCadastro,
      preencherPreCadastro: preencherPreCadastro,
      abrirModalLogin: abrirModalLogin,
      fecharModalLogin: fecharModalLogin,
      abrirModalAlterarSenha: abrirModalAlterarSenha,
      fecharModalAlterarSenha: fecharModalAlterarSenha,
      fazerLogin: fazerLogin,
      alterarSenha: alterarSenha,
      fazerLogout: fazerLogout,
      entrarComMilitarRe: entrarComMilitarRe
    };
  })();

  // Torna submitPreCadastro disponível globalmente para o form onsubmit
  window.submitPreCadastro = function() {
    App.submitPreCadastro();
  };

  // Inicializa o aplicativo após carregamento do DOM
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  } else {
    App.init();
  }
</script>
